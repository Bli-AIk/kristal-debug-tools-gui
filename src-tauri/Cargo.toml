[package]
name = "kristal-debug-tools-gui"
version = "0.1.0"
description = "Deltarune-style GUI for kristal-debug-tools"
authors = ["Bli_Aik"]
edition = "2021"
# tauri dev runs `cargo run`; with two bins it needs to know which one.
default-run = "kristal-debug-tools-gui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kristal_debug_tools_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI sidecar: game launcher + just-task/just-dump. Console subsystem
# (default) so it works inside interactive terminal windows on Windows.
[[bin]]
name = "kristal-run"
path = "src/bin/kristal-run.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde"] }
just = "1.58.0"
