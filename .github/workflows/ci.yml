name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check + test + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri-build resolves the webkit2gtk headers and validates the
      # externalBin path at compile time (the committed x64 placeholder
      # covers this job's host triple).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context!() embeds dist/ at compile time — build it
      # first so the check is representative of a real release build.
      - name: Build frontend
        run: npm run build

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --lib
