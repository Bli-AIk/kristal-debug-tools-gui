name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach assets to
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open or finalize release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        # Pin past v5.0.0: v5.0.0 bundles release-please 17.6.0, which fails on
        # GitHub 502/Server Error while fetching merge commits. This commit
        # includes release-please 17.6.1's GraphQL batch-size backoff fix.
        uses: googleapis/release-please-action@0b6b3fc0186a2f7118bfd88fab9ea481e1839504
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build Tauri bundles (${{ matrix.os }})
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            sidecar: kristal-run
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            sidecar: kristal-run.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build sidecar (tauri externalBin)
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build --release --bin kristal-run
          mkdir -p binaries
          cp target/release/${{ matrix.sidecar }} binaries/kristal-run-${{ matrix.triple }}

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Raw binaries for the no-toolchain launcher (gui.cmd / just gui):
      # gui exe + kristal-run sidecar, renamed per platform, plus SHA256
      # checksums so the download scripts can verify them.
      - name: Stage raw binaries + checksums (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist/upload
          Copy-Item src-tauri/target/release/kristal-debug-tools-gui.exe dist/upload/kristal-debug-tools-gui-windows-x64.exe
          Copy-Item src-tauri/target/release/kristal-run.exe dist/upload/kristal-run-windows-x64.exe
          Get-FileHash dist/upload/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File -Encoding ascii dist/upload/checksums.txt

      - name: Stage raw binaries + checksums (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/upload
          cp src-tauri/target/release/kristal-debug-tools-gui dist/upload/kristal-debug-tools-gui-linux-x64
          cp src-tauri/target/release/kristal-run dist/upload/kristal-run-linux-x64
          (cd dist/upload && sha256sum * > checksums.txt)

      - name: Build Tauri bundles and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          files: dist/upload/*
